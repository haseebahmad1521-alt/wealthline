name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, rebuild]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build Pages artifact
        run: npm run build:pages
        env:
          # Public client values (shipped in the bundle), so repository variables, not secrets.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Fail if the artifact contains secret-looking strings
        run: |
          if grep -rIlE 'service_role|sk_live|SUPABASE_SERVICE_ROLE|FINNHUB' pages-dist; then
            echo "::error::Secret-looking pattern found in pages-dist (files listed above)"; exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
