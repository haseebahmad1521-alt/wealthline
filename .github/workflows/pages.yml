name: Deploy coming-soon page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # No web app for now (native only, owner Nov 17, 2026): Pages serves a static coming-soon page. It also answers
      # old /app/ links and replaces the old app's service worker with one that removes itself.
      - name: Assemble coming-soon page
        run: |
          mkdir -p pages-dist/app pages-dist/privacy pages-dist/terms
          cp soon/index.html pages-dist/index.html
          cp soon/index.html pages-dist/404.html
          cp soon/index.html pages-dist/app/index.html
          cp soon/sw.js pages-dist/app/sw.js
          cp preview/privacy.html pages-dist/privacy/index.html
          cp preview/terms.html pages-dist/terms/index.html
          touch pages-dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
