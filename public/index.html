<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Root-relative URLs below work in dev (base ""); scripts/build-pages.mjs prefixes them with EXPO_BASE_URL. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/wealthline.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wealthline" />
    <!-- GitHub Pages 404.html bounces unknown nested paths to /app/?__route=<path>; restore it before the router boots. -->
    <script>
      (function () {
        var r = new URLSearchParams(location.search).get('__route');
        if (r && r.charAt(0) === '/' && r.charAt(1) !== '/' && r.charAt(1) !== '\\') history.replaceState(null, '', r);
      })();
    </script>
    <!--SW-->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Browser surfaces carry the design: themed focus ring and selection. */
      :focus-visible { outline: 2px solid #0071E3 !important; outline-offset: 2px; }
      ::selection { background: rgba(0, 113, 227, 0.18); }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
