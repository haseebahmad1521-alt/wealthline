# Supabase auth settings for Wealthline, pushed with `npx supabase config push --project-ref <ref>`.
# Only what is declared here is changed on the hosted project.
project_id = "wealthline"

[auth]
site_url = "https://haseebahmad1521-alt.github.io/wealthline/app/"
additional_redirect_urls = [
  "https://haseebahmad1521-alt.github.io/wealthline/**",
  "http://localhost:8081/**",
  "wealthline://**",
  "exp://**",
]
# Mirrors src/lib/password-rules.ts.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

# Branded templates (supabase/templates/) need a custom SMTP sender on the free tier; uncomment once
# [auth.email.smtp] is configured in the dashboard.
# [auth.email.template.confirmation]
# subject = "Activate your Wealthline account"
# content_path = "./supabase/templates/confirm-signup.html"

# [auth.email.template.magic_link]
# subject = "Your Wealthline sign-in code"
# content_path = "./supabase/templates/magic-link.html"

# [auth.email.template.recovery]
# subject = "Reset your Wealthline password"
# content_path = "./supabase/templates/reset-password.html"

[functions.refresh-due]
verify_jwt = false # cron calls it with x-cron-secret, not a user token
